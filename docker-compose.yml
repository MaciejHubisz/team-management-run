# Pre-built images only. No source, schema, or dumps in this folder.
# Wiring only: every setting (ports, URLs, image tag) lives in .env, every
# secret (passwords, keys) in secrets.env (gitignored); containers read both.
name: team-management

services:
  db:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - .env
      - path: secrets.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine

  backend:
    image: ${TEAMMGMT_IMAGE_PREFIX:-ghcr.io/maciejhubisz/team-management}-backend:${TEAMMGMT_IMAGE_TAG:-latest}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      HUEY_IMMEDIATE: "false"
      TEAMMGMT_SEED_DEMO: "${TEAMMGMT_SEED_DEMO:-false}"
      TEAMMGMT_SEED_PROD: "${TEAMMGMT_SEED_PROD:-false}"
      TEAMMGMT_EXPORTS_DIR: /app/exports
      TEAMMGMT_IMPORT_DIR: /app/import
      TEAMMGMT_DEMO_DIR: /app/demo
      TEAMMGMT_PROD_DIR: /app/prod
    env_file:
      - .env
      - path: secrets.env
        required: false
    volumes:
      - ./exports:/app/exports${TEAMMGMT_VOL_OPTS:-}
      - ./import:/app/import${TEAMMGMT_VOL_OPTS:-}
      - ./demo:/app/demo:ro${TEAMMGMT_VOL_OPTS_RO:-}
      - ./prod:/app/prod:ro${TEAMMGMT_VOL_OPTS_RO:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/')"
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    image: ${TEAMMGMT_IMAGE_PREFIX:-ghcr.io/maciejhubisz/team-management}-backend:${TEAMMGMT_IMAGE_TAG:-latest}
    command: python -m huey.bin.huey_consumer config.huey.huey
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      HUEY_IMMEDIATE: "false"
    env_file:
      - .env
      - path: secrets.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  backup:
    # Gzipped export bundle into auto-backups/ (hourly, last 48 h kept by
    # default; see .env). Only this
    # container mounts that folder, so the web app can neither list nor delete it.
    image: ${TEAMMGMT_IMAGE_PREFIX:-ghcr.io/maciejhubisz/team-management}-backend:${TEAMMGMT_IMAGE_TAG:-latest}
    command: python manage.py auto_backup --every ${TEAMMGMT_BACKUP_EVERY:-3600} --keep-hours ${TEAMMGMT_BACKUP_KEEP_HOURS:-48}
    init: true
    restart: unless-stopped
    cpus: 0.5
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TEAMMGMT_AUTO_BACKUP_DIR: /app/auto-backups
    env_file:
      - .env
      - path: secrets.env
        required: false
    volumes:
      - ./auto-backups:/app/auto-backups${TEAMMGMT_VOL_OPTS:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  web:
    image: ${TEAMMGMT_IMAGE_PREFIX:-ghcr.io/maciejhubisz/team-management}-web:${TEAMMGMT_IMAGE_TAG:-latest}
    ports:
      - "${TEAMMGMT_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    name: teammgmt-pg
