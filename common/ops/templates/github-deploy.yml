# Deploy template. After a successful publish (or manual), SSH to the run host
# and run start.sh --update. Disabled until the repository variables exist.
name: deploy

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.MYAPP_DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.MYAPP_DEPLOY_PORT || 22 }}
          script: |
            cd "${{ vars.MYAPP_DEPLOY_PATH || 'myapp-run' }}"
            ./start.sh --update --yes --no-open
