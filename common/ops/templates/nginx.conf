# In-container nginx template. Copy to app/web/nginx.conf and set the backend
# service/port and the public API prefix.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Shared framework modules imported by absolute path (/common/js/...).
    # `^~` keeps the hashed-asset regex below from rewriting them.
    location ^~ /common/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Cache-busted assets: /<rev>/js/... and /<rev>/css/...
    location ~ ^/[A-Za-z0-9_-]+/(css|js)/.+$ {
        rewrite ^/[A-Za-z0-9_-]+/(css|js)/(.+)$ /$1/$2 break;
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
